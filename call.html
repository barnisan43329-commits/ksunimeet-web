<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#171614">
<meta name="robots" content="noindex, nofollow">
<title>Звонок · KsuNiMeet</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  --bg:#171614;--panel:#232220;--line:rgba(255,255,255,.10);
  --text:#f5f3ec;--text-2:rgba(245,243,236,.62);
  --green:#6d8b58;--red:#c0473d;--accent:#c96442;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:var(--font);overflow:hidden;overscroll-behavior:none}
.hidden{display:none!important}
main{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- собеседник ---------- */
#remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0f0e0d}
#remote:not(.on){opacity:0}
.who{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:24px;text-align:center;z-index:2}
.who.gone{opacity:0;pointer-events:none}
.ava{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.08);border:1px solid var(--line);
  font-size:40px;font-weight:600;color:var(--text)}
.name{font-size:24px;font-weight:600;letter-spacing:-.01em}
.phone{font-size:13.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.phase{font-size:14px;color:var(--text-2);min-height:20px}
.timer{font-size:15px;color:var(--text-2);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.net{font-size:12px;color:var(--text-2);opacity:.8;min-height:16px}

/* ---------- своё видео ---------- */
#local{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));
  width:104px;height:150px;object-fit:cover;border-radius:14px;z-index:3;
  background:#0f0e0d;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.45)}
#local.flip{transform:scaleX(-1)}

/* ---------- верх ---------- */
.top{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;
  gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
.mini{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.07);color:var(--text);display:grid;place-items:center}
.mini[disabled]{opacity:.4}

/* ---------- низ: кнопки ---------- */
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:4;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:14px;
  background:linear-gradient(to top,rgba(23,22,20,.94),rgba(23,22,20,0))}
.row{display:flex;align-items:center;justify-content:center;gap:14px}
.ctl{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.08);color:var(--text);display:grid;place-items:center;
  transition:transform .08s,background .12s}
.ctl:active{transform:scale(.94)}
.ctl.red{background:var(--red);border-color:transparent;color:#fff}
.ctl.green{background:var(--green);border-color:transparent;color:#fff}
.ctl.wide{width:auto;border-radius:999px;padding:0 26px;height:60px;font-size:15px;
  font-weight:600;gap:9px;display:flex}
.ctl.off{background:rgba(255,255,255,.22)}
.ctl svg{display:block}
.i-off{display:none}
.ctl.muted .i-on{display:none}
.ctl.muted .i-off{display:block}
.note{font-size:12.5px;color:var(--text-2);text-align:center;max-width:300px;line-height:1.45}
.big{width:72px;height:72px}
</style>
</head>
<body>
<main>
  <video id="remote" autoplay playsinline></video>

  <div id="who" class="who">
    <div id="ava" class="ava">?</div>
    <div id="name" class="name" data-i18n="peer">Собеседник</div>
    <div id="phone" class="phone"></div>
    <div id="phase" class="phase" data-i18n="connecting">Соединяемся…</div>
    <div id="timer" class="timer"></div>
    <div id="net" class="net"></div>
  </div>

  <video id="local" class="hidden flip" autoplay playsinline muted></video>

  <div class="top">
    <button id="min-btn" class="mini" type="button" aria-label="Свернуть" title="Свернуть в приложение" data-i18n-aria="minimize">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7-6 7 6"/><path d="M12 3v11"/><path d="M4 20h16"/></svg>
    </button>
  </div>

  <!-- до ответа: у исходящего — только «отменить», у входящего — ответить/отклонить -->
  <div id="phase-ring" class="bottom">
    <div class="row">
      <button id="btn-decline" class="ctl red big" type="button" aria-label="Отклонить" data-i18n-aria="decline">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button id="btn-accept" class="ctl green big hidden" type="button" aria-label="Ответить" data-i18n-aria="answer">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.6 2z"/></svg>
      </button>
    </div>
    <p class="note" id="ring-note" data-i18n="calling">Вызов…</p>
  </div>

  <!-- разговор -->
  <div id="phase-live" class="bottom hidden">
    <div class="row">
      <button id="mic-btn" class="ctl" type="button" aria-label="Микрофон" title="Микрофон" data-i18n-aria="mute_mic">
        <svg class="i-on" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>
        <svg class="i-off" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-11.5 5.8"/><path d="M12 18v4"/><path d="M4 4l16 16"/></svg>
      </button>
      <button id="cam-btn" class="ctl hidden" type="button" aria-label="Камера" title="Камера" data-i18n-aria="camera">
        <svg class="i-on" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="13" height="12" rx="3"/><path d="m15 10 7-3v10l-7-3"/></svg>
        <svg class="i-off" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="13" height="12" rx="3"/><path d="m15 10 7-3v10l-7-3"/><path d="M4 4l16 16"/></svg>
      </button>
      <button id="flip-btn" class="ctl hidden" type="button" aria-label="Перевернуть камеру" title="Передняя/задняя" data-i18n-aria="flip_cam">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v4h-4"/></svg>
      </button>
      <button id="hang-btn" class="ctl red" type="button" aria-label="Завершить" title="Завершить" data-i18n-aria="hang_up">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.6 2z"/></svg>
      </button>
    </div>
    <p class="note" id="live-note"></p>
  </div>
</main>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="turn.js"></script>
<script src="call.js"></script>
</body>
</html>
