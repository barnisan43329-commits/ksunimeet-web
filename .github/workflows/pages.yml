name: Deploy KsuNiMeet web to GitHub Pages

# Публикуем ТОЛЬКО статику из public/. Секретов в репозитории нет:
# URL проекта и anon-ключ Supabase — публичные (доступ к данным всё равно
# ограничивает RLS в базе), а service_role-ключ здесь не нужен никогда.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не даём двум деплоям идти одновременно; новый не отменяет уже начавшийся.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # supabase-js кладём В САМ САЙТ, а не тянем с CDN: jsDelivr и unpkg
      # стоят за Cloudflare, а именно сеть Cloudflare российские провайдеры
      # режут с июня 2025. Свой файл на своём хостинге этой участи не имеет.
      - name: Vendor supabase-js into the site
        run: |
          mkdir -p public/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js public/vendor/supabase.js

      - name: Write runtime config
        run: |
          cat > public/config.js <<EOF
          window.KSU_CONFIG = {
            supabaseUrl: "${{ vars.SUPABASE_URL }}",
            supabaseAnonKey: "${{ vars.SUPABASE_ANON_KEY }}"
          };
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
