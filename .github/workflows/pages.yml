name: Deploy KsuNiMeet web to GitHub Pages

# Публикуем ТОЛЬКО статику из public/. Секретов в репозитории нет:
# и адрес PocketBase, и URL с anon-ключом Supabase — публичные значения
# (доступ к данным ограничивают правила коллекций в базе), а секретных ключей
# в статическом сайте не бывает вообще.
#
# Какой бэкенд: переменная репозитория KSU_BACKEND ('pocketbase' или
# 'supabase'). Адрес сервера — POCKETBASE_URL. Файл config.js собирается ниже,
# потому что в исходнике этих значений нет и быть не должно.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не даём двум деплоям идти одновременно; новый не отменяет уже начавшийся.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # supabase-js кладём В САМ САЙТ, а не тянем с CDN: jsDelivr и unpkg
      # стоят за Cloudflare, а именно сеть Cloudflare российские провайдеры
      # режут с июня 2025. Свой файл на своём хостинге этой участи не имеет.
      - name: Vendor supabase-js into the site
        run: |
          mkdir -p public/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js public/vendor/supabase.js

      # Проверка, что все страницы и скрипты на месте. Опечатка в имени файла
      # иначе доедет до продакшена и проявится только у пользователя.
      - name: Check that every asset is present
        run: |
          set -e
          for f in public/index.html public/app.js public/call.html public/call.js \
                   public/watch.html public/watch.js public/turn.js public/favicon.svg \
                   public/manifest.json public/vendor/supabase.js public/net.js \
                   public/mirror.js public/ping.js public/layout.js \
                   public/backend.js public/pb.js; do
            test -s "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "all assets present"

      # config.js собирается здесь, а не лежит в репозитории: адрес сервера
      # отличается на каждом стенде, и держать его в исходнике значит
      # протаскивать боевой адрес в каждый клон.
      - name: Write runtime config
        env:
          BACKEND: ${{ vars.KSU_BACKEND }}
          PB: ${{ vars.POCKETBASE_URL }}
          SB: ${{ vars.SUPABASE_URL }}
          SBK: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ "${BACKEND:-pocketbase}" = "pocketbase" ]; then
            cat > public/config.js <<EOF
          window.KSU_CONFIG = {
            backend: "pocketbase",
            pbUrl: "$PB"
          };
          EOF
          else
            cat > public/config.js <<EOF
          window.KSU_CONFIG = {
            backend: "supabase",
            supabaseUrl: "$SB",
            supabaseAnonKey: "$SBK"
          };
          EOF
          fi
          echo "--- public/config.js ---"
          cat public/config.js

      # Соединение с бэкендом открываем ЗАРАНЕЕ, ещё на разборе страницы.
      # Скрипты лежат на своём домене, а первый запрос к базе (вход, история)
      # уходит на соседний хост — без preconnect браузер тратит на него
      # лишний круг DNS+TLS, и это самые заметные сотни миллисекунд входа.
      # Для российского канала это ещё и важно вдвойне: меньше кругов — меньше
      # шансов попасть в 16-килобайтный обрыв.
      # Подставить адрес можно только на сборке: в исходнике его нет.
      - name: Preconnect to the backend host
        env:
          BACKEND: ${{ vars.KSU_BACKEND }}
          PB: ${{ vars.POCKETBASE_URL }}
          SB: ${{ vars.SUPABASE_URL }}
        run: |
          set -e
          if [ "${BACKEND:-pocketbase}" = "pocketbase" ]; then URL="$PB"; else URL="$SB"; fi
          HOST=$(printf '%s' "$URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          if [ -n "$HOST" ]; then
            sed -i "s#<!--PRE-CONNECT-->#<link rel=\"preconnect\" href=\"$HOST\" crossorigin>#" public/index.html
          fi
          grep -o 'preconnect[^>]*' public/index.html || echo 'preconnect not injected'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
